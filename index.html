<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nico's English Challenge</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#17132e,#12355a 70%,#133d43) fixed;color:#eef4ff;font:17px system-ui}main{max-width:850px;margin:auto;padding:24px}h1{font-size:clamp(29px,6vw,46px);margin:8px 0}h2{margin:8px 0 18px}button,input,textarea,select{font:inherit}button{border:0;border-radius:13px;padding:13px 17px;background:#f7cc55;color:#13221a;font-weight:750;cursor:pointer;margin:5px 4px 5px 0}button.secondary{background:#354563;color:white}button:disabled{opacity:.5}nav{display:flex;flex-wrap:wrap;gap:5px}.panel{background:#202d49;padding:22px;border-radius:20px;margin:18px 0}.story{white-space:pre-wrap;line-height:1.65;background:#f4f7ff;color:#17243e;padding:20px;border-radius:12px}textarea,input{width:100%;padding:12px;border:2px solid #63759a;border-radius:10px;background:#fff;color:#14213b;margin:10px 0}textarea{min-height:80px}.muted{color:#b6c6e3}.good{color:#f7cc55}.bad{color:#ffd38b}.track{height:9px;background:#394865;border-radius:10px;overflow:hidden}.fill{height:100%;background:#f7cc55}#feedback{line-height:1.5}small{color:#b6c6e3}</style></head><body><main><small>GRAND LINE × ZERO BUILD • ENGLISH REVISION</small><h1>🏴‍☠️ Nico’s English Quest</h1><p class="muted">Explore islands. Complete missions. Earn XP!</p><div id="score"></div><nav id="nav"></nav><div id="app"></div></main><script>
const readingOriginal=[{title:'A day at the aquarium',text:`Hi Ben!\nLast Sunday, I went to an aquarium with my cousins. We travelled by train and arrived at ten o’clock. It was raining outside, but we were very excited. A guide gave us a map. First, we watched the sharks. My cousin Emma was taking photos when a seal jumped out of the water. We laughed because it was very funny. At lunchtime, we ate pizza and drank orange juice. Before going home, we bought a postcard at the gift shop. We were tired but happy.\nBest wishes,\nOliver`,q:[['When did Oliver visit the aquarium?','Oliver visited the aquarium last Sunday.',['last sunday'],'Oliver visited ...'],['Who did he go with?','He went with his cousins.',['cousins'],'He went with ...'],['How did they travel?','They travelled by train.',['train'],'They travelled ...'],['What did the guide give them?','The guide gave them a map.',['map'],'The guide gave ...'],['What was Emma doing when the seal jumped?','She was taking photos.',['taking','photos|pictures'],'She was ...'],['Why did they laugh?','They laughed because the seal was very funny.',['because','funny'],'They laughed because ...'],['What did they eat for lunch?','They ate pizza.',['pizza'],'They ate ...'],['Where did they go before going home?','They went to the gift shop.',['gift shop'],'They went to ...']]},{title:'A forest adventure',text:`Hi Lucy!\nLast Saturday, my brother and I visited a national park with our parents. We left home at eight o’clock because we wanted to see wild animals. The weather was sunny and warm. While we were walking along a trail, we heard a loud noise. A small bird was sitting in a tree. My brother took a picture of it. After lunch, we climbed a hill and saw a beautiful river. Before we left, we visited the information centre. It was an amazing day!\nBest wishes,\nSophie`,q:[['When did Sophie visit the park?','She visited the park last Saturday.',['last saturday'],'She visited ...'],['Who did she go with?','She went with her brother and parents.',['brother','parents'],'She went with ...'],['Why did they leave home early?','They left early because they wanted to see wild animals.',['because','animals'],'They left early because ...'],['What were they doing when they heard a noise?','They were walking along a trail.',['walking','trail'],'They were ...'],['Where was the bird sitting?','It was sitting in a tree.',['tree'],'It was sitting ...'],['What did they see from the hill?','They saw a beautiful river.',['river'],'They saw ...'],['Where did they go before leaving?','They visited the information centre.',['information centre|information center'],'They visited ...']]}];
const listeningOriginal=[{title:'The science museum',text:'Last Friday, Mia went to a science museum with her dad. They arrived at eleven o’clock. First, they watched a film about space. Mia was looking at a rocket when her dad called her. For lunch, they ate sandwiches and drank water. Before going home, Mia bought a small toy rocket. She felt very happy.',q:[['When did Mia go to the museum?','Last Friday',['Last Saturday','Last Friday','Last Monday']],['Who went with Mia?','Her dad',['Her mum','Her friends','Her dad']],['What time did they arrive?','Eleven o’clock',['Nine o’clock','Eleven o’clock','Ten o’clock']],['What was Mia looking at?','A rocket',['A rocket','A planet','A robot']],['What did they drink?','Water',['Lemonade','Milk','Water']],['What did Mia buy?','A toy rocket',['A postcard','A toy rocket','A book']]]},{title:'A trip to the zoo',text:'On Sunday, Sam and his sister went to the zoo by bus. It was sunny but cold. First, they saw a bear and two parrots. The bear was sleeping when a parrot made a loud noise. Sam took some photos. At one o’clock they ate lunch near the entrance. Sam liked the parrots best because they were colourful.',q:[['How did they travel?','By bus',['By train','By bus','By car']],['What was the weather like?','Sunny but cold',['Rainy','Sunny and hot','Sunny but cold']],['How many parrots did they see?','Two',['One','Two','Three']],['The bear was sleeping.','True',['True','False']],['When did they eat lunch?','At one o’clock',['At twelve','At two','At one o’clock']],['Why did Sam like the parrots?','They were colourful',['They were big','They were colourful','They were strong']]]}];
const reading=[{"title": "🏴‍☠️ One Piece – The secret island", "text": "Hi Ace!\nLast Saturday, I went to a mysterious island with Luffy and his crew. We left our ship at nine o’clock because we wanted to find a treasure. The weather was sunny but windy. Nami gave us a map. While Zoro was walking along a forest trail, we heard a strange noise. Chopper got scared, but Luffy found a small monkey behind a tree. After lunch, we climbed a hill and saw a beautiful waterfall. Before returning to the ship, we found an old treasure chest near a cave. We were tired but excited!\nBest wishes,\nUsopp", "q": [["When did Usopp visit the island?", "He visited the island last Saturday.", ["last saturday"], "He visited ..."], ["Who did he go with?", "He went with Luffy and his crew.", ["luffy", "crew"], "He went with ..."], ["Why did they leave the ship?", "They left because they wanted to find a treasure.", ["because", "treasure"], "They left because ..."], ["What did Nami give them?", "She gave them a map.", ["map"], "She gave ..."], ["What was Zoro doing when they heard a noise?", "He was walking along a forest trail.", ["walking", "trail"], "He was ..."], ["What did Luffy find?", "He found a small monkey.", ["monkey"], "He found ..."], ["Where did they find the chest?", "They found it near a cave.", ["cave"], "They found ..."], ["How did they feel?", "They felt tired but excited.", ["tired", "excited"], "They felt ..."]]}, {"title": "🎮 Fortnite – The island mission", "text": "Hi Max!\nYesterday, my friends and I played Fortnite in Zero Build mode. We landed near a lake at the beginning of the match. First, we explored a small house and found some supplies. My friend Leo was looking for shields when we heard a car. We travelled to a hill because the storm was getting closer. On the way, Mia helped a teammate. At the top of the hill, we could see a river and a bridge. Finally, our team won the match. We were very happy because we worked together.\nBest wishes,\nAlex", "q": [["When did Alex play Fortnite?", "He played Fortnite yesterday.", ["yesterday"], "He played ..."], ["Who did he play with?", "He played with his friends.", ["friends"], "He played with ..."], ["Where did they land?", "They landed near a lake.", ["lake"], "They landed ..."], ["What was Leo doing when they heard a car?", "He was looking for shields.", ["looking", "shields"], "He was ..."], ["Why did they travel to a hill?", "They travelled there because the storm was getting closer.", ["because", "storm"], "They travelled ... because ..."], ["Who helped a teammate?", "Mia helped a teammate.", ["mia", "helped"], "Mia ..."], ["Why were they happy?", "They were happy because they worked together.", ["because", "together"], "They were happy because ..."]]}].concat(readingOriginal);
const listening=[{"title": "🏴‍☠️ Pirate mission", "text": "Last Sunday, Nami and Chopper visited a small village. They arrived at ten o’clock. First, they bought some fruit. Nami was reading a map when Chopper saw a colourful parrot. They ate sandwiches for lunch. Before going back to the ship, they found a silver key near the beach.", "q": [["When did they visit the village?", "Last Sunday", ["Last Friday", "Last Sunday", "Last Monday"]], ["What time did they arrive?", "Ten o’clock", ["Nine o’clock", "Eleven o’clock", "Ten o’clock"]], ["What did they buy?", "Fruit", ["Bread", "Fruit", "Fish"]], ["What was Nami doing?", "Reading a map", ["Reading a map", "Taking photos", "Eating lunch"]], ["What animal did Chopper see?", "A parrot", ["A fox", "A parrot", "A monkey"]], ["Where did they find the key?", "Near the beach", ["Near a river", "Near a cave", "Near the beach"]]]}, {"title": "🎮 Zero Build mission", "text": "On Friday, Ben and his friends played a Fortnite match. They landed near a bridge. It was close to a river. Ben was opening a chest when his friend called him. They travelled by car to a hill. There were three teammates with Ben. They finished second, but they were happy because they helped each other.", "q": [["When did they play?", "Friday", ["Monday", "Friday", "Sunday"]], ["Where did they land?", "Near a bridge", ["Near a bridge", "Near a forest", "Near a beach"]], ["What was Ben doing?", "Opening a chest", ["Driving a car", "Opening a chest", "Reading a map"]], ["How did they travel?", "By car", ["On foot", "By bus", "By car"]], ["How many teammates were with Ben?", "Three", ["Two", "Three", "Four"]], ["What position did they finish in?", "Second", ["First", "Second", "Third"]]]}].concat(listeningOriginal);
const grammar=[{title:'Simple Past',q:[['Yesterday we ___ (go) to the park.','went'],['Dad ___ (drive) us to the museum.','drove'],['We ___ (see) a fox.','saw'],['I ___ (take) a photo.','took'],['They ___ (not / eat) pizza.','did not eat|didn’t eat|didn\'t eat'],['She ___ (try) an experiment.','tried'],['He ___ (not / feel) scared.','did not feel|didn\'t feel|didn’t feel'],['We ___ (be) tired.','were'],['I ___ (buy) a souvenir.','bought'],['They ___ (drink) lemonade.','drank'],['We ___ (blow) bubbles.','blew'],['He ___ (say) it was fun.','said']]},{title:'WH-words',q:[['___ did you go? — To the park.','where'],['___ did you go with? — My cousins.','who'],['___ did you travel? — By car.','how'],['___ did you arrive? — At nine.','when'],['___ did you see? — A fox.','what'],['___ were you happy? — Because it was fun.','why']]},{title:'Simple Present',q:[['Tom ___ (have) breakfast every day.','has'],['Jack ___ (study) Maths on Tuesdays.','studies'],['They ___ (not / play) tennis on Wednesdays.','do not play|don\'t play|don’t play'],['Jack ___ (watch) cartoons.','watches'],['Tom ___ (not / read) before bed.','does not read|doesn\'t read|doesn’t read']]},{title:'Past Continuous & Simple Past',q:[['They ___ (watch) a film when the guide arrived.','were watching'],['Tom was doing an experiment when it ___ (stop).','stopped'],['The boys ___ (blow) bubbles when Dad called.','were blowing'],['Tom ___ (sit) in the café when Dad brought the food.','was sitting'],['His friends were taking photos when Tom ___ (run) into the room.','ran']]},{title:'Comparisons',q:[['A fox is ___ (small) than a bear.','smaller'],['A bear is ___ (heavy) than a fox.','heavier'],['Of the three objects, the 10 kg box is the ___ (heavy).','heaviest'],['This parrot is ___ (colourful) than that seal.','more colourful|more colorful'],['Of these three animals, the one with the highest danger rating is the ___ (dangerous).','most dangerous'],['A snake is ___ (thin) than a bear.','thinner'],['This joke is ___ (funny) than that one.','funnier']]}];
let mode='reading',level=0,i=0,done=false,points=0,correct=0,attempts=0;try{points=Number(localStorage.getItem('nicoPoints')||0)}catch(e){}const $=id=>document.getElementById(id);const norm=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');function score(){$('score').innerHTML=`⭐ ${points} XP`};function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}function setMode(m){stop();mode=m;level=0;i=0;correct=0;attempts=0;done=false;render()};function data(){return ({reading,listening,grammar})[mode]};function change(n){stop();level=n;i=0;correct=0;attempts=0;done=false;render()};function speak(rate){if(!('speechSynthesis'in window)){ $('audioStatus').textContent='Este navegador no permite reproducir la voz. Probá Safari.';return}stop();let u=new SpeechSynthesisUtterance(data()[level].text);u.lang='en-GB';u.rate=rate;let voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;u.onstart=()=>$('audioStatus').textContent='Listening…';u.onend=()=>$('audioStatus').textContent='Finished! Answer the questions.';u.onerror=()=>$('audioStatus').textContent='Audio interrumpido. Probá tocar Play otra vez.';speechSynthesis.speak(u)}function render(){score();$('nav').innerHTML=[['reading','🏴‍☠️ Reading'],['listening','🎧 Listening'],['grammar','⚔️ Training Camp']].map(([m,t])=>`<button class="${m===mode?'':'secondary'}" onclick="setMode('${m}')">${t}</button>`).join('');let d=data()[level];let html=`<div class="panel"><label for="level">Choose a level</label> <select id="level" onchange="change(+this.value)">${data().map((x,j)=>`<option value="${j}" ${j===level?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div>`;if(mode==='reading')html+=`<div class="panel"><h2>${esc(d.title)}</h2><div class="story">${esc(d.text)}</div></div>`;if(mode==='listening')html+=`<div class="panel"><h2>🎧 ${esc(d.title)}</h2><p>Listen first. Then answer. You can listen again.</p><button onclick="speak(.88)">▶ Play audio</button><button class="secondary" onclick="speak(.72)">🐢 Slower</button><button class="secondary" onclick="stop()">■ Stop</button><p id="audioStatus" aria-live="polite"></p><details><summary>Transcript (only after practice)</summary><p>${esc(d.text)}</p></details></div>`;if(mode==='grammar'){let tips=['Past: go → went. Negative: did not + base verb.','Who = person; where = place; when = time; why = reason; how = manner; what = thing.','He/she/it: add -s or -es. Negative: doesn’t + base verb.','was/were + verb-ing for an action in progress; Simple Past for the event that interrupted it.','Short adjectives: -er / -est. Long adjectives: more / most.'];html+=`<div class="panel"><details><summary>💡 Quick rule</summary><p>${tips[level]}</p></details></div>`}if(i>=d.q.length){html+=`<div class="panel"><h2>🏆 Mission complete!</h2><p>First-try correct: ${correct} / ${d.q.length}</p><button onclick="change(level)">Try again</button>${level+1<data().length?'<button onclick="change(level+1)">Next level →</button>':''}</div>`;$('app').innerHTML=html;return}let q=d.q[i];html+=`<div class="panel"><small>QUESTION ${i+1} / ${d.q.length}</small><div class="track"><div class="fill" style="width:${100*i/d.q.length}%"></div></div><h2>${esc(q[0])}</h2>`;if(mode==='listening')html+=q[2].map((a,j)=>`<button class="secondary choice" onclick="checkChoice(${j})">${esc(a)}</button>`).join('');else html+=`<label for="answer">${mode==='reading'?'Write a full answer in English.':'Complete the blank.'}</label>${mode==='reading'?'<textarea id="answer" autocomplete="off" spellcheck="false"></textarea>':'<input id="answer" autocomplete="off" spellcheck="false">'}<button id="check" onclick="check()">Check answer</button>`;html+=`<button class="secondary" onclick="hint()">💡 Hint</button><div id="feedback" aria-live="polite"></div><button id="next" class="secondary" hidden onclick="next()">Next →</button></div>`;$('app').innerHTML=html;done=false;attempts=0}function hint(){let q=data()[level].q[i];$('feedback').textContent=mode==='reading'?q[3]:mode==='listening'?'Listen again and focus on the question.':'First letter: '+q[1][0].toUpperCase();}function checkChoice(j){judge(data()[level].q[i][2][j]===data()[level].q[i][1])}function check(){let q=data()[level].q[i],a=norm($('answer').value);if(!a){$('feedback').textContent='Write your answer first!';return}let ok=mode==='grammar'?q[1].split('|').some(x=>norm(x)===a):q[2].every(k=>k.split('|').some(x=>a.includes(x)))&&a.split(' ').length>=4;judge(ok)}function judge(ok){if(done)return;attempts++;let q=data()[level].q[i];if(ok){done=true;if(attempts===1){correct++;points+=10}else points+=5;try{localStorage.setItem('nicoPoints',points)}catch(e){}score();$('feedback').innerHTML=`<p class="good">⭐ ${mode==='reading'?'Good! You found the key information.':'Correct!'}</p><p>Model answer: ${esc(q[1].split('|')[0])}</p>${mode==='reading'?'<small>Compare your verbs and full sentence with the model.</small>':''}`;$('next').hidden=false}else{$('feedback').innerHTML=`<p class="bad">Not quite. Try again!</p>${attempts>=2?`<p>Model answer: ${esc(q[1].split('|')[0])}</p>`:''}`;if(attempts>=2)$('next').hidden=false}}function next(){stop();i++;render()}render();</script></body></html>
